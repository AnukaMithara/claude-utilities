<!doctype html>
<!-- Extension icon. The build renders it once per size: icon.html?size=128 -->
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; }
    svg { display: block; }
  </style>
</head>
<body>
  <svg id="icon" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#E08563"/>
        <stop offset="1" stop-color="#C15F3C"/>
      </linearGradient>
      <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
        <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
    <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#shine)"/>
    <!-- lightning bolt -->
    <path d="M286 72 L132 290 H244 L218 440 L380 214 H268 Z"
          fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
  </svg>
  <script>
    const size = new URLSearchParams(location.search).get("size");
    if (size) {
      const icon = document.getElementById("icon");
      icon.setAttribute("width", size);
      icon.setAttribute("height", size);
    }
  </script>
</body>
</html>
