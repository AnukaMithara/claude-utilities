<!doctype html>
<!-- Chrome Web Store small promo tile, 440x280. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="store.css">
  <style>
    .tile { width: 440px; height: 280px; display: flex; flex-direction: column; justify-content: center; padding: 0 36px;
            background: radial-gradient(circle at 90% 10%, rgba(217,119,87,0.28), transparent 55%), #1a1918; }
    .tile img { width: 64px; height: 64px; margin-bottom: 18px; }
    .tile h1 { font-size: 34px; margin: 0 0 8px; }
    .tile p { margin: 0; font-size: 16px; color: var(--muted); line-height: 1.4; }
  </style>
</head>
<body class="dark">
  <div class="tile">
    <img src="../../icons/icon128.png" alt="">
    <h1>Claude Utilities</h1>
    <p>Auto-accept tool permissions per tab<br>and insert saved prompts in one click.</p>
  </div>
</body>
</html>
