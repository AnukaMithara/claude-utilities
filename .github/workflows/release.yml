# Builds the extension zip and publishes a GitHub release.
#
# Runs when a version tag is pushed (git tag v1.2.0 && git push origin v1.2.0),
# or by hand from the Actions tab ("Run workflow"), which tags the chosen branch
# with the version in manifest.json.
#
# The tag must match the version in manifest.json and package.json. The release
# notes are that version's section of CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check scripts and versions
        run: npm run check

      - name: Work out the version
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version (expected $tag)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Refuse to replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Release ${{ steps.version.outputs.tag }} already exists. Bump the version in manifest.json and package.json first."
            exit 1
          fi

      - name: Build the zip
        run: npm run package

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${{ steps.version.outputs.version }}."
            exit 1
          fi
          {
            echo
            echo "### Install"
            echo
            echo "Download \`claude-utilities-${{ steps.version.outputs.version }}.zip\`, unzip it, open \`chrome://extensions\`, turn on Developer mode and choose **Load unpacked**."
          } >> notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/claude-utilities-${{ steps.version.outputs.version }}.zip" \
            --title "Claude Utilities ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
